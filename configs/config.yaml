# go-ants v0.3.1 配置文件

server:
  addr: ":8080"
  mode: "debug"       # debug | release

database:
  driver: "mysql"     # mysql | postgres
  dsn: "root:password@tcp(127.0.0.1:3306)/go_ants?charset=utf8mb4&parseTime=True&loc=Local"
  max_idle_conns: 10
  max_open_conns: 100

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

log:
  level: "info"
  format: "console"   # console | json

auth:
  jwt_secret: "change-me-in-production"
  jwt_issuer: "go-ants"
  jwt_expiration: 86400       # 24 小时（秒）
  jwt_refresh_expiration: 2592000  # 30 天（秒）
